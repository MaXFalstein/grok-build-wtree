[workspace]
resolver = "2"

[package]
name = "groktree"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Read-only inspector for Grok Build worktrees, their origins, and git repos in synced folders"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/MaXFalstein/groktree"
keywords = ["git", "worktree", "grok", "tree"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "groktree"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
